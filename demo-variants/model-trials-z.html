    '<div class="sec"><div class="sec-h"><span class="t-h2">Data</span></div><div class="col">' +
      '<button class="tile pressable" data-act="export-all">' + ic('down', 19) + '<div class="tile-main"><div class="t-h2" style="font-size:.94rem">Export everything</div><div class="tile-sub">All events and model definitions as one JSON file (keys excluded).</div></div>' + ic('chevr', 16, 'faint') + '</button>' +
      '<button class="tile pressable" data-act="import-file">' + ic('up', 19) + '<div class="tile-main"><div class="t-h2" style="font-size:.94rem">Import backup</div><div class="tile-sub">Restore exported events. Imported copies get fresh IDs.</div></div>' + ic('chevr', 16, 'faint') + '</button>' +
      '<input type="file" id="import-input" accept=".json,application/json" style="display:none">' +
    '</div></div>' +
    '<div class="sec"><div class="sec-h"><span class="t-h2">Experience</span></div><div class="card card-pad">' +
      '<div class="switch-row"><div class="sw-main"><div style="font-weight:650;font-size:.92rem">Reduce motion</div><div class="t-sub">Minimise animations and micro-interactions.</div></div>' +
      '<button class="switch' + (S.prefs.reduceMotion ? ' on' : '') + '" data-act="toggle-motion" role="switch" aria-checked="' + !!S.prefs.reduceMotion + '" aria-label="Reduce motion"><span class="knob"></span></button></div>' +
    '</div></div>' +
    '<div class="sec"><div class="sec-h"><span class="t-h2">About</span></div><div class="card card-pad">' +
      '<div class="row" style="gap:.6rem">' + logoSvg(34) + '<div><div class="t-title">Model Trials</div><div class="t-small">v1.0 · MVP · PRD v0.3.0</div></div></div>' +
      '<div class="divider" style="margin:.8rem 0"></div>' +
      '<div class="t-sub" style="line-height:1.7">Same objective. Defined conditions. Independent execution. Measurable results.<br><br>' +
      'The platform never moves money. You are solely responsible for all capital, risk and regulatory compliance in real-money competitions.<br><br>' +
      'To install as an app: host this single file (e.g. GitHub Pages), open it over HTTPS and use your browser’s “Install app” action. Events export and import as JSON for backup and migration.</div>' +
    '</div></div>' +
    '<div class="sec"><div class="sec-h"><span class="t-h2">Danger zone</span></div>' +
      '<button class="tile pressable" data-act="wipe-all" style="border-color:var(--danger-soft)">' + ic('trash', 19) + '<div class="tile-main"><div class="t-h2" style="font-size:.94rem;color:var(--danger)">Erase all data</div><div class="tile-sub">Deletes every event, model and key from this browser.</div></div></button>' +
    '</div>' +
  '</div>';
}

/* ---------------- wizard: new event ---------------- */
const W = { step:0, back:false, data:null, capitalDefault:10000 };
function wzStart(){ W.step = 0; W.back = false; W.data = newEvent(); W.capitalDefault = 10000; }
function vNew(){
  if (!W.data) wzStart();
  const ev = W.data;
  const steps = ['Template','Basics','Participants','Criteria','Milestones','Review'];
  const pct = ((W.step + 1) / steps.length) * 100;
  const body = [wzStepTemplate, wzStepBasics, wzStepParticipants, wzStepCriteria, wzStepMilestones, wzStepReview][W.step](ev);
  const last = W.step === steps.length - 1;
  const nextLabel = last ? 'Create event' : W.step === 0 ? 'Start' : 'Continue';
  return '<div class="ev-shell">' +
    '<div class="ev-appbar">' +
      '<button class="btn-icon bare" data-act="wz-exit" aria-label="Save and close">' + ic('x', 20) + '</button>' +
      '<div class="title">' + steps[W.step] + '</div>' +
      '<div class="step-dots">' + steps.map((s, i) => '<i class="' + (i <= W.step ? 'on' : '') + '"></i>').join('') + '</div>' +
    '</div>' +
    '<div style="padding:0 .9rem"><div class="wz-progress"><i style="width:' + pct + '%"></i></div></div>' +
    '<div class="ev-body"><div class="wz-step' + (W.back ? ' back' : '') + '" style="max-width:100%">' + body + '</div></div>' +
    '<div class="composer" style="gap:.6rem">' +
      (W.step > 0 ? '<button class="btn btn-ghost" data-act="wz-back">' + ic('chevl', 17) + 'Back</button>' : '<button class="btn btn-ghost" data-act="wz-exit">Cancel</button>') +
      '<button class="btn btn-primary" data-act="wz-next" style="flex:2">' + (last ? ic('check', 17) + 'Create event' : nextLabel) + ic('chevr', 16) + '</button>' +
    '</div>' +
  '</div>';
}
function wzStepTemplate(ev){
  return '<div class="stagger"><div class="t-title" style="margin:.6rem .1rem 0">Pick a starting point</div>' +
    '<p class="t-sub px-s">A template pre-fills objective, rules, criteria and milestones. You can change everything later.</p>' +
    '<div class="col mt-m">' + TEMPLATES.map((t, i) =>
      '<button class="tile pressable' + (ev.template === t.id ? ' on' : '') + '" data-act="wz-tpl" data-t="' + t.id + '" style="--i:' + i + (ev.template === t.id ? ';border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)' : '') + '">' +
      '<span class="av av-' + (i % 5) + '">' + ic(t.icon, 19) + '</span>' +
      '<div class="tile-main"><div style="font-weight:650;font-size:.94rem">' + esc(t.name) + '</div><div class="tile-sub">' + esc(t.desc) + '</div></div>' +
      (ev.template === t.id ? ic('checkc', 20) : ic('chevr', 16, 'faint')) + '</button>'
    ).join('') + '</div></div>';
}
function wzStepBasics(ev){
  return '<div class="stagger">' +
    '<div class="field"><label class="label">Title</label><input class="input" placeholder="e.g. AI Trading Duel — Q4" data-input="wz-title" value="' + esc(ev.title) + '"></div>' +
    '<div class="field"><label class="label">Objective</label><textarea class="textarea" rows="3" placeholder="What exactly should participants achieve? Same objective for everyone." data-input="wz-objective">' + esc(ev.objective) + '</textarea></div>' +
    '<div class="field"><label class="label">Rules <span class="faint">(one per line)</span></label><textarea class="textarea" rows="4" placeholder="Constraints, tools allowed, reporting requirements…" data-input="wz-rules">' + esc(ev.rules) + '</textarea><div class="hint">Rules are immutable after start — later changes are recorded as amendments.</div></div>' +
    '<div class="field"><label class="label">Category</label><select class="select" data-input="wz-category">' +
      ['general','trading','content','research','product','other'].map(c => '<option' + (ev.category === c ? ' selected' : '') + '>' + c + '</option>').join('') + '</select></div>' +
    '<div class="field"><label class="label">Ends at <span class="faint">(optional)</span></label><input class="input" type="datetime-local" data-input="wz-ends" value="' + (ev.endsAt ? toLocalInput(ev.endsAt) : '') + '"></div>' +
    '<div class="card card-pad"><div class="switch-row" style="padding:0">' +
      '<div class="sw-main"><div style="font-weight:650;font-size:.92rem">' + ic('wallet', 14) + ' Real-money event</div><div class="t-sub">Track advice, portfolios and P&L. The platform never moves money — you are solely responsible for all capital, risk and compliance.</div></div>' +
      '<button class="switch' + (ev.realMoney.enabled ? ' on' : '') + '" data-act="wz-rm" role="switch" aria-checked="' + !!ev.realMoney.enabled + '"><span class="knob"></span></button></div>' +
      (ev.realMoney.enabled ? '<div class="field mt-m" style="margin-bottom:0"><label class="label">Starting capital per participant (' + esc(ev.realMoney.currency) + ')</label><input class="input num" type="number" min="0" step="any" data-input="wz-capital" value="' + W.capitalDefault + '"><div class="hint">Tracked as data only. Record portfolio snapshots during the event.</div></div>' : '') +
    '</div></div>';
}
function wzStepParticipants(ev){
  const canAdd = ev.participants.length < 5;
  return '<div class="stagger">' +
    '<div class="row" style="margin:.6rem .1rem 0"><div style="flex:1"><div class="t-title">Participants</div><p class="t-sub">2–5 competitors, each with independent state.</p></div>' +
    '<span class="sum-pill' + (ev.participants.length >= 2 ? ' ok' : '') + '" id="pz-count">' + ev.participants.length + ' / 5</span></div>' +
    '<div class="col mt-m">' + ev.participants.map((p, i) =>
      '<div class="card card-pad">' +
      '<div class="row" style="margin-bottom:.55rem"><span class="av av-' + (i % 5) + '">' + esc(initials(p.name)) + '</span><b style="flex:1;font-size:.92rem">Participant ' + (i + 1) + '</b>' +
      (ev.participants.length > 2 ? '<button class="btn-icon bare" data-act="wz-pdel" data-i="' + i + '" aria-label="Remove">' + ic('trash', 16) + '</button>' : '') + '</div>' +
      '<div class="field" style="margin-bottom:.6rem"><input class="input" placeholder="Pseudonym shown in the event" data-input="wz-pname" data-i="' + i + '" value="' + esc(p.name) + '"></div>' +
      '<div class="field" style="margin-bottom:0"><select class="select" data-input="wz-pmodel" data-i="' + i + '">' +
        '<option value="">Manual / external</option>' +
        S.models.filter(m => m.provider !== 'manual').map(m => '<option value="' + m.id + '"' + (p.modelId === m.id ? ' selected' : '') + '>' + esc(modelLabel(m)) + (m.modelId ? ' — ' + esc(m.modelId) : '') + '</option>').join('') +
      '</select><div class="hint">Each participant gets a private conversation and context.</div></div>' +
      '</div>'
    ).join('') +
    (canAdd ? '<button class="tile pressable" data-act="wz-padd" style="border-style:dashed;justify-content:center">' + ic('plus', 18) + '<span style="font-weight:650;font-size:.9rem">Add participant</span></button>' : '') +
    '</div>' +
    '<div class="field mt-l"><label class="label">Visibility mode</label><div class="seg">' +
      Object.keys(VIS_META).map(k => '<button class="seg-btn' + (ev.visibility === k ? ' on' : '') + '" data-act="wz-vis" data-v="' + k + '">' + VIS_META[k].label + '</button>').join('') + '</div>' +
    '<div class="hint">' + esc(VIS_META[ev.visibility].desc) + ' Enforced in the UI and in prompt construction.</div></div>' +
  '</div>';
}
function wzStepCriteria(ev){
  const sum = ev.criteria.reduce((a, c) => a + (Number(c.weight) || 0), 0);
  return '<div class="stagger">' +
    '<div class="row" style="margin:.6rem .1rem 0"><div style="flex:1"><div class="t-title">Evaluation criteria</div><p class="t-sub">Weighted scoring — weights must total 100%.</p></div>' +
    '<span class="sum-pill' + (sum === 100 ? ' ok' : '') + '" id="cr-sum">' + sum + '%</span></div>' +
    '<div class="col mt-m">' + ev.criteria.map((c, i) =>
      '<div class="crit-row" style="padding:.55rem 0">' +
      '<input class="input" placeholder="Criterion, e.g. Rigor & evidence" style="flex:1" data-input="wz-clabel" data-i="' + i + '" value="' + esc(c.label) + '">' +
      '<input class="input num" type="number" min="0" max="100" step="1" style="width:4.4rem;text-align:center;padding:.45rem .3rem" data-input="wz-cweight" data-i="' + i + '" value="' + c.weight + '">' +
      '<button class="btn-icon bare" data-act="wz-cdel" data-i="' + i + '" aria-label="Remove criterion">' + ic('x', 15) + '</button>' +
      '</div>'
    ).join('') +
    '<button class="tile pressable" data-act="wz-cadd" style="border-style:dashed;justify-content:center">' + ic('plus', 18) + '<span style="font-weight:650;font-size:.9rem">Add criterion</span></button>' +
    '</div>' +
    (sum !== 100 && ev.criteria.length ? '<button class="pill-btn mt-m" data-act="wz-balance">' + ic('spark', 14) + 'Auto-balance to 100%</button>' : '') +
  '</div>';
}
function wzStepMilestones(ev){
  return '<div class="stagger">' +
    '<div class="row" style="margin:.6rem .1rem 0"><div style="flex:1"><div class="t-title">Milestones</div><p class="t-sub">Optional checkpoints with deadlines and deliverables.</p></div>' +
    '<span class="sum-pill' + (ev.milestones.length ? ' ok' : '') + '">' + ev.milestones.length + '</span></div>' +
    '<div class="col mt-m">' + ev.milestones.map((m, i) =>
      '<div class="card card-pad">' +
      '<div class="row" style="margin-bottom:.5rem"><b style="flex:1;font-size:.92rem">Milestone ' + (i + 1) + '</b>' +
      '<button class="btn-icon bare" data-act="wz-mdel" data-i="' + i + '" aria-label="Remove">' + ic('trash', 16) + '</button></div>' +
      '<div class="field" style="margin-bottom:.55rem"><input class="input" placeholder="Title, e.g. Opening positions" data-input="wz-mtitle" data-i="' + i + '" value="' + esc(m.title) + '"></div>' +
      '<div class="field" style="margin-bottom:.55rem"><input class="input" placeholder="Required deliverable" data-input="wz-mdeliv" data-i="' + i + '" value="' + esc(m.deliverable) + '"></div>' +
      '<input class="input" type="datetime-local" data-input="wz-mdue" data-i="' + i + '" value="' + (m.deadline ? toLocalInput(m.deadline) : '') + '">' +
      '</div>'
    ).join('') +
    '<button class="tile pressable" data-act="wz-madd" style="border-style:dashed;justify-content:center">' + ic('plus', 18) + '<span style="font-weight:650;font-size:.9rem">Add milestone</span></button>' +
    '</div><div class="hint mt-m px-s">Deadlines are enforced client-side. Missed ones are logged and surfaced when you return.</div></div>';
}
function wzStepReview(ev){
  const prob = [];
  if (!ev.title.trim()) prob.push('Title is missing');
  if (!ev.objective.trim()) prob.push('Objective is missing');
  if (ev.participants.length < 2) prob.push('Need at least 2 participants');
  if (ev.participants.some(p => !p.name.trim())) prob.push('Every participant needs a pseudonym');
  const sum = ev.criteria.reduce((a, c) => a + (Number(c.weight) || 0), 0);
  if (!ev.criteria.length || sum !== 100) prob.push('Criteria weights must total 100% (currently ' + sum + '%)');
  return '<div class="stagger">' +
    '<div class="t-title" style="margin:.6rem .1rem 0">Review</div>' +
    '<div class="card card-pad mt-m"><span class="t-micro">Event</span><div class="t-h2 mt-s">' + esc(ev.title || 'Untitled') + '</div>' +
    '<div class="t-sub mt-s" style="white-space:pre-wrap">' + esc(ev.objective || '—') + '</div>' +
    '<div class="row-wrap mt-m"><span class="badge b-neutral">' + esc(ev.category) + '</span><span class="badge b-neutral">' + esc(VIS_META[ev.visibility].label) + '</span>' +
    (ev.realMoney.enabled ? '<span class="badge b-rm">' + ic('wallet', 12) + 'Real-money</span>' : '') + '</div></div>' +
    '<div class="card card-pad mt-m"><span class="t-micro">Participants</span>' + ev.participants.map((p, i) => {
      const m = p.modelId ? modelById(p.modelId) : null;
      return '<div class="crit-row"><span class="av av-sm av-' + (i % 5) + '">' + esc(initials(p.name)) + '</span><span style="flex:1;font-size:.88rem">' + esc(p.name) + '</span><span class="t-small">' + esc(m ? modelLabel(m) : 'Manual') + '</span></div>';
    }).join('') + '</div>' +
    '<div class="card card-pad mt-m"><span class="t-micro">Criteria</span>' + ev.criteria.map(c => '<div class="crit-row"><span class="wtag num">' + c.weight + '%</span><span style="flex:1;font-size:.88rem">' + esc(c.label) + '</span></div>').join('') + '</div>' +
    (ev.milestones.length ? '<div class="card card-pad mt-m"><span class="t-micro">Milestones</span>' + ev.milestones.map(m => '<div class="crit-row">' + ic('flag', 15, 'faint') + '<span style="flex:1;font-size:.88rem">' + esc(m.title) + '</span><span class="t-small">' + (m.deadline ? fmtDate(m.deadline) : '') + '</span></div>').join('') + '</div>' : '') +
    (prob.length ? '<div class="banner dang mt-m">' + ic('warn', 18) + '<div><div class="t-h2" style="font-size:.88rem">Before creating:</div>' + prob.map(p => '<div class="t-sub">' + esc(p) + '</div>').join('') + '</div></div>' : '<div class="banner mt-m" style="background:var(--accent-fade)">' + ic('checkc', 18) + '<div class="t-sub" style="color:var(--accent-ink)">Everything looks good. The event will be created as <b>Ready</b> — start it when you are.</div></div>') +
  '</div>';
}
</script>
<script>
'use strict';
/* ============================================================
   ACTIONS — central delegation
   ============================================================ */
const ACTIONS = {
  nav: el => { nav(el.dataset.to || '#/home'); },
  'load-demo': () => loadDemo(),

  /* events list */
  'ev-filter': el => { S.eventsFilter = el.dataset.f; render(); },

  /* event tabs & chat */
  'ev-tab': el => { S.evTab = el.dataset.t; render(); },
  'open-chat': el => { const ev = evById(S.routeArg); if (!ev) return; S.chatPid = el.dataset.pid; S.evTab = 'chat'; render(); },
  'resume-dismiss': el => { S.resumeShown[el.dataset.id] = true; render(); },
  'chat-send': async el => {
    const ev = evById(el.dataset.id); const p = partOf(ev, el.dataset.pid);
    const ta = $('#composer-ta'); const text = (ta ? ta.value : '').trim();
    if (!ev || !p || !text) return;
    delete S.composerDraft[ev.id + ':' + p.id];
    if (ta) ta.value = '';
    buzz(10);
    await sendToParticipant(ev, p, text, 'prompt', { onPending(){ if (S.route === 'event' && S.routeArg === ev.id && S.evTab === 'chat') render(); } });
    if (S.route === 'event' && S.routeArg === ev.id && S.evTab === 'chat') render();
  },
  'chat-paste': async el => {
    const ev = evById(el.dataset.id); const p = partOf(ev, el.dataset.pid);
    const box = $('#paste-box'); const text = (box ? box.value : '').trim();
    if (!ev || !p || !text){ toast('Paste the reply first', 'warn'); return; }
    await insertManualReply(ev, p, text);
    toast('Reply recorded', 'check');
    render();
  },
  'chat-skip': async el => {
    const ev = evById(el.dataset.id); const p = partOf(ev, el.dataset.pid);
    if (!p) return;
    p.awaiting = false;
    pushMsg(ev, p.id, { role:'system', kind:'note', content:'Dismissed — reply not recorded.' });
    await putEvent(ev); render();
  },
  'provider-help': () => openProviderHelp(),

  /* lifecycle */
  'ev-start': async el => {
    const ev = evById(el.dataset.id); if (!ev) return;
    if (activeParticipants(ev).length < 2){ toast('An event needs at least 2 participants', 'warn'); return; }
    ev.status = 'running'; ev.startedAt = now();
    logT(ev, 'started', 'Competition started');
    await putEvent(ev);
    toast('Competition started', 'play'); buzz(14);
    schedulerTick(); render();
  },
  'ev-pause': async el => {
    const ev = evById(el.dataset.id); if (!ev) return;
    ev.status = 'paused';
    logT(ev, 'paused', 'Competition paused');
    await putEvent(ev); toast('Paused'); render();
  },
  'ev-resume': async el => {
    const ev = evById(el.dataset.id); if (!ev) return;
    ev.status = 'running';
    logT(ev, 'started', 'Competition resumed');
    await putEvent(ev); toast('Resumed', 'play'); render();
  },
  'ev-complete': el => openCompleteSheet(evById(el.dataset.id)),
  'ev-cancel': async el => {
    const ev = evById(el.dataset.id); if (!ev) return;
    const ok = await confirmSheet({ title:'Cancel this event?', body:'The event is marked cancelled and stops scheduling. History is preserved.', danger:true, confirm:'Cancel event', icon:'stop' });
    if (!ok) return;
    ev.status = 'cancelled'; ev.endedAt = now();
    logT(ev, 'cancelled', 'Event cancelled');
    await putEvent(ev); toast('Event cancelled'); render();
  },
  'ev-export': el => { const ev = evById(el.dataset.id); if (ev) exportEvent(ev); },
  'ev-duplicate': async el => {
    const ev = evById(el.dataset.id); if (!ev) return;
    const c = deep(ev);
    c.id = uid('ev'); c.title = ev.title + ' (copy)';
    c.status = 'ready'; c.startedAt = null; c.endedAt = null; c.results = null;
    c.conversations = {}; c.submissions = []; c.evaluations = []; c.amendments = [];
    c.schedules = []; c.timeline = []; c.createdAt = now();
    c.realMoney.capital = {};
    for (const p of c.participants){ p.stats = { msgs:0, tin:0, tout:0, cost:0 }; p.awaiting = false; }
    logT(c, 'created', 'Duplicated from “' + ev.title + '”');
    await putEvent(c);
    toast('Duplicated — open the copy', 'copy');
    nav('#/event/' + c.id);
  },
  'ev-delete': async el => {
    const ev = evById(el.dataset.id); if (!ev) return;
    const ok = await confirmSheet({ title:'Delete “' + (ev.title || 'event') + '”?', body:'Everything is removed permanently — conversations, submissions, evaluations, history. Export first if you want a copy.', danger:true, confirm:'Delete forever', icon:'trash' });
    if (!ok) return;
    await delEvent(ev.id);
    toast('Event deleted'); nav('#/events');
  },
  'ev-menu': el => openEventMenu(evById(el.dataset.id)),
  'ev-edit': el => openBasicsEditSheet(evById(el.dataset.id)),

  /* milestones & submissions */
  'ms-new': el => openMsSheet(evById(el.dataset.id), null),
  'ms-open': el => openMsSheet(evById(el.dataset.id), el.dataset.ms),
  'sub-new': (el, e) => {
    const ev = evById(el.dataset.id); if (!ev) return;
    openSubSheet(ev, { type: el.dataset.type || 'text', milestoneId: el.dataset.ms || '', pid: el.dataset.pid || '' });
  },
  'sub-view': el => {
    const ev = evById(el.dataset.id); const s = ev && ev.submissions.find(x => x.id === el.dataset.sid);
    if (s) openSubView(ev, s);
  },

  /* evaluation */
  'eval-new': el => { const ev = evById(el.dataset.id); if (ev) openEvalSheet(ev); },
  'eval-view': el => { const ev = evById(el.dataset.id); const e = ev && ev.evaluations.find(x => x.id === el.dataset.eid); if (e) openEvalView(ev, e); },

  /* chat extras */
  'sys-prompt': el => openSysPromptSheet(evById(el.dataset.id), el.dataset.pid),
  'sched-new': el => openSchedSheet(evById(el.dataset.id), el.dataset.pid),
  'sched-toggle': async el => {
    const ev = evById(el.dataset.id); const sc = ev && ev.schedules.find(x => x.id === el.dataset.sid);
    if (!sc) return;
    sc.enabled = !sc.enabled;
    if (sc.enabled && sc.kind === 'oneoff' && sc.nextRun < now()) sc.nextRun = now() + HOUR;
    logT(ev, 'schedule', 'Schedule “' + (sc.title || 'prompt') + '” ' + (sc.enabled ? 'enabled' : 'paused'));
    await putEvent(ev); render();
  },
  'sched-del': async el => {
    const ev = evById(el.dataset.id); const sc = ev && ev.schedules.find(x => x.id === el.dataset.sid);
    if (!sc) return;
    ev.schedules = ev.schedules.filter(x => x.id !== sc.id);
    logT(ev, 'schedule', 'Schedule “' + (sc.title || 'prompt') + '” removed');
    await putEvent(ev); toast('Schedule removed'); render();
  },

  /* models */
  'model-new': () => openModelSheet(null),
  'model-edit': el => openModelSheet(modelById(el.dataset.id)),

  /* settings */
  'export-all': () => exportAll(),
  'import-file': () => { const i = $('#import-input'); if (i) i.click(); },
  'toggle-motion': async el => {
    S.prefs.reduceMotion = !S.prefs.reduceMotion;
    document.documentElement.classList.toggle('reduce-motion', !!S.prefs.reduceMotion);
    await DB.kvSet('prefs', S.prefs);
    render();
  },

  'wz-cdel': el => { const ev = W.data; if (ev){ ev.criteria.splice(Number(el.dataset.i), 1); render(); } },
  'wz-balance': () => {
    const ev = W.data; if (!ev || !ev.criteria.length) return;
    const n = ev.criteria.length;
    const each = Math.floor(100 / n);
    ev.criteria.forEach((c, i) => { c.weight = i === 0 ? 100 - each * (n - 1) : each; });
    render();
  },

  'wz-mdel': el => { const ev = W.data; if (ev){ ev.milestones.splice(Number(el.dataset.i), 1); render(); } },
  'wz-back': () => { if (W.step > 0){ W.back = true; W.step--; render(); } },
  'wz-next': () => wzNext(),
  'wz-exit': async () => {
    const ev = W.data;
    if (ev && (ev.title.trim() || ev.objective.trim())){
      ev.status = 'draft';
      logT(ev, 'created', 'Saved as draft');
      await putEvent(ev);
      toast('Saved as draft');
    }
    W.data = null;
    nav('#/events');
  },
};

/* ---------------- wizard next ---------------- */
function wzNext(){
  const ev = W.data; if (!ev) return;
  if (W.step === 0){ W.step = 1; W.back = false; render(); return; }
  if (W.step === 1){
    if (!ev.title.trim()){ toast('Give the event a title', 'warn'); return; }
    if (!ev.objective.trim()){ toast('Describe the objective', 'warn'); return; }
  }
  if (W.step === 2){
    if (ev.participants.length < 2){ toast('At least 2 participants', 'warn'); return; }
    if (ev.participants.some(p => !p.name.trim())){ toast('Every participant needs a pseudonym', 'warn'); return; }
  }
  if (W.step === 3){
    const sum = ev.criteria.reduce((a, c) => a + (Number(c.weight) || 0), 0);
    if (!ev.criteria.length){ toast('Add at least one criterion', 'warn'); return; }
    if (sum !== 100){ toast('Weights must total 100% — currently ' + sum + '%', 'warn'); return; }
  }
  if (W.step === 4){
    if (ev.milestones.some(m => !m.title.trim())){ toast('Milestones need titles', 'warn'); return; }
    if (ev.milestones.some(m => !m.deadline)){ toast('Milestones need deadlines', 'warn'); return; }
  }
  if (W.step === 5){ createFromWizard(); return; }
  W.step++; W.back = false; render();
}
async function createFromWizard(){
  const ev = W.data; if (!ev) return;
  ev.status = 'ready';
  if (ev.realMoney.enabled){
    const cap = Number(W.capitalDefault) || 0;
    for (const p of ev.participants) ev.realMoney.capital[p.id] = cap;
  }
  logT(ev, 'created', 'Event created' + (ev.template && ev.template !== 'blank' ? ' from template' : ''));
  await putEvent(ev);
  S.prefs.onboarded = true;
  await DB.kvSet('prefs', S.prefs);
  W.data = null;
  S.evTab = 'overview';
  toast('Event created — ready to start', 'spark');
  buzz(14);
  nav('#/event/' + ev.id);
}

function openSchedSheet(ev, pid){

      (acts.length > 1 ? '<option value="all">All active participants</option>' : '') +

    '<div class="sheet-foot"><button class="btn btn-ghost" data-x="cancel">Cancel</button><button class="btn btn-primary" data-x="save">' + ic('clock', 16) + 'Schedule</button></div>');
  const el = $$('#sheet-root .sheet-wrap').pop();
  let kind = 'oneoff';
  $$('#sc-kind .seg-btn', el).forEach(b => b.onclick = () => {
    kind = b.dataset.k;
    $$('#sc-kind .seg-btn', el).forEach(x => x.classList.toggle('on', x === b));

/* ---------------- export / import ---------------- */
function download(name, text){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type:'application/json' }));
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportEvent(ev){
  download('model-trials-' + slug(ev.title) + '.json', JSON.stringify({ app:'model-trials', type:'event', version:1, exportedAt:new Date().toISOString(), event:deep(ev) }, null, 2));
  toast('Exported — check your downloads', 'down');
}
function exportAll(){
  const models = S.models.map(m => { const c = deep(m); delete c.keyEnc; return c; });
  download('model-trials-backup-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify({ app:'model-trials', type:'full', version:1, exportedAt:new Date().toISOString(), prefs:S.prefs, events:S.events.map(deep), models }, null, 2));
  toast('Backup exported', 'down');
}
async function importData(text){
  let o;
  try { o = JSON.parse(text); } catch(e){ toast('That file is not valid JSON', 'warn', 3000, true); return; }
  if (!o || o.app !== 'model-trials'){ toast('Not a Model Trials export', 'warn', 3000, true); return; }
  let nE = 0, nM = 0;
  try {
    if (o.type === 'event' && o.event){ await importEvent(o.event); nE = 1; }
    if (Array.isArray(o.events)) for (const e of o.events){ await importEvent(e); nE++; }
    if (Array.isArray(o.models)) for (const m of o.models){
      if (!m || !m.provider) continue;
      if (S.models.some(x => x.name === m.name && x.provider === m.provider)) continue;
      const c = deep(m); c.id = uid('md'); delete c.keyEnc;
      await putModel(c); nM++;
    }
  } catch(e){ toast('Import failed: ' + (e && e.message || e), 'warn', 3200, true); return; }
  toast('Imported ' + nE + ' event' + (nE === 1 ? '' : 's') + ', ' + nM + ' model' + (nM === 1 ? '' : 's'), 'up', 3000);
  render();
}
async function importEvent(e){
  if (!e || typeof e !== 'object' || !e.participants) return;
  const c = deep(e);
  c.id = uid('ev');
  c.demo = false;
  c.title = (c.title || 'Imported event');
  await putEvent(c);
}

/* ---------------- router ---------------- */
function parseRoute(){
  const hh = location.hash || '#/home';
  const m = hh.match(/^#\/([a-z]+)(?:\/([\w-]+))?/);
  S.route = m ? m[1] : 'home';
  S.routeArg = m ? m[2] : null;
}
function render(){
  const route = S.route;
  const app = $('#app');
  document.body.classList.toggle('immersive', route === 'event' || route === 'new');
  let html = '';
  try {
    const views = { home:vHome, events:vEvents, event:() => vEvent(S.routeArg), new:vNew, models:vModels, settings:vSettings };
    html = (views[route] || vHome)();
  } catch(err){
    html = appbar('Model Trials', '') + '<div class="page content">' + emptyState('warn', 'Something went wrong', esc(err && err.message || String(err)), '<a class="btn btn-primary" href="#/home">Go home</a>') + '</div>';
  }
  app.innerHTML = html;
  renderTabbar(route);
  armCountUps(); armRings(); armBars();
  if (route === 'event' && S.evTab === 'chat'){
    const ms = $('#msgs');
    if (ms) ms.scrollTop = ms.scrollHeight;
    const ta = $('#composer-ta');
    if (ta && ta.value){ ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 120) + 'px'; }
  }
  if (route !== 'event' && route !== 'new') window.scrollTo(0, 0);
  const ab = $('[data-appbar]');
  if (ab) ab.classList.toggle('scrolled', window.scrollY > 8);
}
function updateCountdowns(){
  $$('.due-chip[data-ts]').forEach(chip => {
    const ts = Number(chip.dataset.ts);
    const diff = ts - now();
    const num = chip.querySelector('.num');
    if (num) num.textContent = diff < 0 ? 'overdue ' + fmtDur(-diff) : fmtDur(diff) + ' left';
    chip.classList.toggle('over', diff < 0);
    chip.classList.toggle('soon', diff >= 0 && diff < 2 * DAY);
  });
  $$('[data-remain]').forEach(el => {
    const ts = Number(el.dataset.remain);
    const diff = ts - now();
    el.textContent = diff > 0 ? fmtDur(diff) : 'Time is up';
  });
  $$('[data-rel]').forEach(el => {
    el.textContent = fmtRel(Number(el.dataset.rel));
  });
}

/* ---------------- global delegation ---------------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const fn = ACTIONS[t.dataset.act];
  if (fn) { e.preventDefault(); fn(t, e); }
});
document.addEventListener('input', e => {
  const t = e.target.closest('[data-input]');
  if (!t) return;
  const fn = INPUTS[t.dataset.input];
  if (fn) fn(t, e);
});
document.addEventListener('change', e => {
  if (e.target && e.target.id === 'import-input'){
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => importData(String(r.result));
    r.readAsText(f);
    e.target.value = '';
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    const wraps = $$('#sheet-root .sheet-wrap');
    if (wraps.length){ closeTopSheet(); return; }
  }
  if (e.key === 'Enter' && !e.shiftKey && e.target && e.target.id === 'composer-ta'){
    e.preventDefault();
    const btn = $('.send-btn');
    if (btn) btn.click();
  }
});
window.addEventListener('scroll', () => {
  const ab = $('[data-appbar]');
  if (ab) ab.classList.toggle('scrolled', window.scrollY > 8);
}, { passive:true });

  const manifest = {
    name:'Model Trials', short_name:'Trials',
    description:'Structured competitions between AI models — local-first and private.',
    start_url:'.', scope:'.', display:'standalone', orientation:'portrait',
    background_color:'#F3F1EC', theme_color:'#F3F1EC',
    icons:[ { src:icon, sizes:'any', type:'image/svg+xml', purpose:'any' } ],
  };
  const ml = $('#manifest-link');
  if (ml) ml.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
})();

/* ---------------- init ---------------- */
(async function init(){
  await DB.open();
  await DB.whenReady();
  S.storageMode = DB.mode;
  S.events = (await DB.all('events')).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  S.models = (await DB.all('models')).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const p = await DB.kvGet('prefs');
  if (p) S.prefs = Object.assign(S.prefs, p);
  document.documentElement.classList.toggle('reduce-motion', !!S.prefs.reduceMotion);
  if (!location.hash) location.hash = '#/home';
  parseRoute();
  render();
  window.addEventListener('hashchange', () => { parseRoute(); render(); });
  startScheduler();
  setInterval(updateCountdowns, 30000);
  window.MT = { S, evById, modelById, loadDemo, render, nav, toast, ACTIONS, TEMPLATES, createFromWizard, importData, exportAll, W, putEvent, DB, delEvent };
})();
</script>
